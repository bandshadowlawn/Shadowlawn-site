<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --text: #f0ede8;
      --muted: #888;
      --accent: #c8a96e;
      --accent-dim: rgba(200, 169, 110, 0.12);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 20px 80px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Header */
    .header {
      text-align: center;
      padding-bottom: 36px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1.5px solid var(--accent);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .name {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .tagline {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
    }

    .link-item:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .link-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-icon svg {
      width: 20px;
      height: 20px;
    }

    .link-text {
      flex: 1;
    }

    .link-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .link-value {
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
    }

    .link-arrow {
      color: var(--muted);
      flex-shrink: 0;
      font-size: 18px;
      transition: color 0.2s, transform 0.2s;
    }

    .link-item:hover .link-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    /* Icon backgrounds */
    .icon-email   { background: rgba(100, 160, 220, 0.12); }
    .icon-spotify { background: rgba(30, 215, 96, 0.12); }
    .icon-instagram { background: rgba(225, 90, 130, 0.12); }
    .icon-venmo   { background: rgba(0, 130, 215, 0.12); }

    /* Footer */
    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #444;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
